<svg width="220" height="46" viewBox="0 0 220 46" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title id">
<title id="title">DataTales</title>
<desc id="desc">DataTales Newsroom Logo</desc>
<rect width="220" height="46" fill="white"/>
<g transform="translate(0 4)">
  <!-- Red square badge with rounded corners -->
  <rect x="2" y="2" width="38" height="38" rx="10" fill="#a71b20"/>
  <!-- White D path inside the badge -->
  <path d="M12 28V13h8.2c5 0 8.3 2.8 8.3 7.5S25.2 28 20.2 28H12Zm4.2-3.5h3.7c2.8 0 4.3-1.5 4.3-4s-1.5-4-4.3-4h-3.7v8Z" fill="#fff"/>
  <!-- Gold vertical accent line and circles -->
  <path d="M30 12v17" stroke="#F4D35E" stroke-width="3.3" stroke-linecap="round"/>
  <circle cx="30" cy="12" r="2.6" fill="#F4D35E"/>
  <circle cx="30" cy="29" r="2.6" fill="#F4D35E"/>
  
  <!-- "DataTales" text on the right -->
  <!-- "Data" in dark navy/charcoal -->
  <text x="53" y="23" fill="#273043" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="19" font-weight="800" letter-spacing="-0.5">Data</text>
  <!-- "Tales" in vibrant red -->
  <text x="96" y="23" fill="#a71b20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="19" font-weight="800" letter-spacing="-0.5">Tales</text>
  
  <!-- Tagline below -->
  <text x="53" y="36" fill="#6C757D" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="500" letter-spacing="0.5">BÁO CHÍ DỮ LIỆU TƯƠNG TÁC</text>
  
  <path d="M211 6v34" stroke="#D7DBDF"/>
</g>
</svg>
