<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark only">
  <title>Chương IV — Sinh viên dùng AI</title>
  <link href="https://s1.vnecdn.net/vnexpress/restruct/images/favicon.ico" rel="shortcut icon" type="image/x-icon">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">

  <style>
    /* ════════════════════════════════════════════
       PREMIUM DESIGN SYSTEM & BRAND TOKENS
       ════════════════════════════════════════════ */
    :root {
      --bg-dark: #07070a;
      --panel-bg: rgba(13, 13, 20, 0.45);
      --border-glow: rgba(0, 229, 255, 0.15);
      --primary-cyan: #00e5ff;
      --primary-purple: #9d4edd;
      --text-white: #ffffff;
      --text-muted: #8e90a6;
      --font-title: 'Outfit', 'Inter', sans-serif;
      --font-body: 'Inter', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-drag: none;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-white);
      font-family: var(--font-body);
      min-height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    /* Ambient Background Gradients */
    .ambient-bg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      overflow: hidden;
      pointer-events: none;
    }

    .glow-circle {
      position: absolute;
      border-radius: 50%;
      filter: blur(140px);
      opacity: 0.15;
      will-change: transform;
    }

    .glow-cyan {
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, var(--primary-cyan) 0%, transparent 70%);
      top: -10%;
      left: -10%;
      animation: drift 25s infinite alternate ease-in-out;
    }

    .glow-purple {
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, var(--primary-purple) 0%, transparent 70%);
      bottom: -15%;
      right: -10%;
      animation: drift 30s infinite alternate-reverse ease-in-out;
    }

    @keyframes drift {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(80px, 50px) scale(1.2); }
    }

    /* Premium Glassmorphic Container */
    .container {
      position: relative;
      z-index: 10;
      width: 90%;
      max-width: 720px;
      padding: 60px 40px;
      background: var(--panel-bg);
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 24px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4),
                  inset 0 1px 0 rgba(255, 255, 255, 0.1);
      text-align: center;
      animation: cardFadeIn 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      will-change: transform, opacity;
    }

    @keyframes cardFadeIn {
      0% { opacity: 0; transform: translateY(40px) scale(0.96); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* Chapter Header */
    .chapter-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      background: rgba(0, 229, 255, 0.06);
      border: 1px solid rgba(0, 229, 255, 0.25);
      border-radius: 100px;
      color: var(--primary-cyan);
      font-family: var(--font-title);
      font-size: 13px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 28px;
      animation: pulseGlow 3s infinite alternate;
    }

    @keyframes pulseGlow {
      0% { box-shadow: 0 0 10px rgba(0, 229, 255, 0.05); border-color: rgba(0, 229, 255, 0.2); }
      100% { box-shadow: 0 0 20px rgba(0, 229, 255, 0.2); border-color: rgba(0, 229, 255, 0.5); }
    }

    .chapter-title {
      font-family: var(--font-title);
      font-size: 42px;
      font-weight: 800;
      line-height: 1.25;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #ffffff 30%, #a2a8d3 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 20px;
    }

    .chapter-subtitle {
      font-size: 16px;
      line-height: 1.6;
      color: var(--text-muted);
      max-width: 560px;
      margin: 0 auto 36px auto;
    }

    .chapter-subtitle strong {
      color: var(--text-white);
      font-weight: 600;
    }

    /* Futuristic Interface Elements */
    .divider {
      width: 80px;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--primary-cyan), transparent);
      margin: 0 auto 36px auto;
    }

    .hud-element {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      padding: 12px 24px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.04);
      margin-bottom: 40px;
    }

    .pulse-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: var(--primary-cyan);
      box-shadow: 0 0 8px var(--primary-cyan);
      animation: blink 1.5s infinite alternate ease-in-out;
    }

    @keyframes blink {
      0% { opacity: 0.2; transform: scale(0.8); }
      100% { opacity: 1; transform: scale(1.1); }
    }

    .hud-text {
      font-family: var(--font-title);
      font-size: 14px;
      color: var(--text-white);
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    /* Elegant CTA Button */
    .btn-return {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      padding: 16px 36px;
      border-radius: 100px;
      font-family: var(--font-title);
      font-size: 15px;
      font-weight: 600;
      color: var(--bg-dark);
      background: var(--text-white);
      border: none;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 10px 25px rgba(255, 255, 255, 0.08);
    }

    .btn-return:hover {
      transform: translateY(-2px);
      background: var(--primary-cyan);
      box-shadow: 0 15px 30px rgba(0, 229, 255, 0.25);
    }

    .btn-return:active {
      transform: translateY(0);
    }

    .btn-return svg {
      width: 18px;
      height: 18px;
      transition: transform 0.3s ease;
    }

    .btn-return:hover svg {
      transform: translateX(-4px);
    }

    /* Client-side protection overlays */
    .security-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 9999;
      box-shadow: inset 0 0 80px rgba(0, 229, 255, 0.015);
    }

    /* Responsive */
    @media (max-width: 576px) {
      .container {
        padding: 45px 25px;
      }
      .chapter-title {
        font-size: 32px;
      }
      .chapter-subtitle {
        font-size: 14px;
      }
    }
  </style>
</head>
<body oncontextmenu="return false;">

  <!-- Ambient glowing spheres -->
  <div class="ambient-bg">
    <div class="glow-circle glow-cyan"></div>
    <div class="glow-circle glow-purple"></div>
  </div>

  <!-- Content protection layer -->
  <div class="security-overlay"></div>

  <!-- Main Container -->
  <div class="container">
    <!-- Chapter Badge -->
    <div class="chapter-badge">
      <div class="pulse-dot"></div>
      <span>Chương IV</span>
    </div>

    <!-- Chapter Title -->
    <h1 class="chapter-title">Đang phát triển</h1>

    <div class="divider"></div>

    <!-- Chapter Subtitle -->
    <p class="chapter-subtitle">
      Phần tiếp theo của dự án báo chí dữ liệu: <strong>"Kiểm soát công nghệ hay bị công nghệ dẫn dắt?"</strong> đang được biên tập và lập trình.<br>
      Hãy đón chờ những phân tích sâu sắc tiếp theo về hành vi số của người trẻ.
    </p>

    <!-- Status HUD -->
    <div class="hud-element">
      <div class="pulse-dot"></div>
      <span class="hud-text">Trạng thái: Đang biên soạn dữ liệu</span>
    </div>

    <br>

    <!-- CTA Button -->
    <a href="chapter-3.html" class="btn-return">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="19" y1="12" x2="5" y2="12"></line>
        <polyline points="12 19 5 12 12 5"></polyline>
      </svg>
      Quay lại chương trước
    </a>
  </div>

  <!-- ════════════════════════════════════════════
       ADVANCED CONTENT PROTECTION (SENIOR LEVEL)
       ════════════════════════════════════════════ -->
  <script>
    // Audio trigger on button hover
    const btn = document.querySelector('.btn-return');
    btn.addEventListener('mouseenter', () => {
      try {
        const hoverCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = hoverCtx.createOscillator();
        const gain = hoverCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(440, hoverCtx.currentTime); // Soft A4 pitch
        osc.frequency.exponentialRampToValueAtTime(880, hoverCtx.currentTime + 0.12);
        gain.gain.setValueAtTime(0.04, hoverCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, hoverCtx.currentTime + 0.12);
        osc.connect(gain);
        gain.connect(hoverCtx.destination);
        osc.start();
        osc.stop(hoverCtx.currentTime + 0.15);
      } catch (e) {}
    });

    // Disable standard F12, developer hotkeys, view-source and print screen to align with BCDL visual novel protection goals
    document.addEventListener('keydown', (e) => {
      if (e.key === 'F12' || e.keyCode === 123) e.preventDefault();
      if (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'i' || e.key === 'J' || e.key === 'j' || e.key === 'C' || e.key === 'c')) e.preventDefault();
      if (e.ctrlKey && (e.key === 'U' || e.key === 'u')) e.preventDefault();
      if (e.key === 'PrintScreen' || e.keyCode === 44) {
        navigator.clipboard.writeText('');
        e.preventDefault();
      }
    });

    document.addEventListener('keyup', (e) => {
      if (e.key === 'PrintScreen' || e.keyCode === 44) {
        navigator.clipboard.writeText('');
      }
    });
  </script>
</body>
</html>
