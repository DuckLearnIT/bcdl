<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="assets/favicon.ico" rel="shortcut icon" type="image/x-icon">
    <title>Ngọn lửa ấm từ những tàn tro vụng về</title>
    <link rel="preload" href="assets/fonts/momo.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/video/handclose.mp4" as="video" type="video/mp4">
<link rel="preload" href="assets/video/handopen.mp4" as="video" type="video/mp4">
<link rel="preload" href="assets/video/holdopen.mp4" as="video" type="video/mp4">
    <link rel="stylesheet" href="assets/css/chapter-5.css">
</head>
<body>

    <!-- Nền water ripple -->
    <div class="full-landing-image">
        <div class="start-instruction">nhấp chuột trái để mở mắt</div>
    </div>

    <!-- Lớp chứa nền Video POV (Đu đưa nhẹ nhàng) -->
    <div id="pov-container">
        <!-- Double Buffering Video System -->
        <video id="video-1" class="video-layer" loop muted playsinline></video>
        <video id="video-2" class="video-layer" loop muted playsinline></video>
    </div>

    <!-- Hệ thống Hiệu ứng Tầm nhìn (Visual FX) -->
    <div id="blur-overlay"></div>
    <div id="black-overlay"></div>
    <div id="white-overlay"></div>

    <!-- Removed ripple trigger button, user can click anywhere on the background -->

    <!-- Hệ thống Phụ đề (Subtitle UI) -->
    <div id="subtitle-ui">
        <div id="subtitle-text" class="subtitle-text"></div>
    </div>

    <!-- Màn hình kết (Typewriter) -->
    <div id="ending-screen">
        <div id="ending-text" class="typewriter-text"></div>
    </div>

    <!-- Màn hình Credit Roll (ẩn ban đầu) — 2 cột: video trái + credit cuộn phải -->
    <div id="credit-screen" class="credit-screen">

        <!-- Spinner: hiện khi video chưa sẵn sàng -->
        <div id="credit-loading" class="credit-loading">
            <div class="credit-spinner"></div>
        </div>

        <!-- Cột trái: Video credit.mp4 -->
        <div class="credit-video-col">
            <video id="credit-video" class="credit-video" playsinline preload="none">
                <source src="assets/video/credit.mp4" type="video/mp4">
            </video>
        </div>

        <!-- Cột phải: Credit Roll -->
        <div class="credit-roll-col">
            <div id="credit-roll-inner" class="credit-roll-inner">
                <!-- Credit lines sẽ được JS inject vào đây -->
            </div>
        </div>

    </div>

    <!-- Màn hình Give (post-credit) -->
    <div id="give-screen" class="give-screen">
        <video id="give-video" class="give-video" playsinline preload="none" muted>
            <source src="assets/video/give.mp4" type="video/mp4">
        </video>

        <div id="give-subtitle-ui" class="give-subtitle-ui">
            <div id="give-subtitle-text" class="subtitle-text"></div>
        </div>

        <div id="give-white-overlay" class="give-white-overlay"></div>
        <div id="give-ending-text" class="give-ending-text"></div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery.ripples/0.5.3/jquery.ripples.min.js"></script>
    <script src="assets/js/chapter-5.js"></script>
</body>
</html>
