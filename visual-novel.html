<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Visual Novel Dialogue</title>
<link href="assets/favicon.ico" rel="shortcut icon" type="image/x-icon">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/visual-novel.css">
</head>
<body>
<div class="vn-container" id="vn-container">
    <div class="vn-background" style="background-image: url('assets/img/vnexpress/bg_cndtf0.webp');"></div>

    <div class="vn-character-wrap">
        <img id="vn-sprite" fetchpriority="high" class="vn-sprite" src="assets/img/amy/normal/default.webp" alt="Character Pose">
    </div>

    <div class="vn-dialogue-bar" id="vn-dialogue-bar" onclick="advanceDialogue()">
        <div class="vn-dialogue-inner">
            <img class="bar-bg" src="assets/img/dialogue_bar.webp" alt="">
            <div class="vn-name" id="vn-name">Người Hướng Dẫn</div>
            <div class="vn-text" id="vn-text"></div>
            <div class="vn-next-indicator" id="vn-indicator">▼</div>
        </div>
    </div>
</div>

<script src="assets/js/dialogue-fit.js"></script>
<script src="assets/js/visual-novel.js"></script>
</body>
</html>
