<!-- Flash overlay -->

<!-- Main VN Scene — shows immediately, no start screen -->

    <!-- Background (white) -->

    <!-- Character Sprite — centered, behind dialogue bar -->

    </div>

        <div class="vn-dialogue-frame">
            <div class="vn-name-strip">
                <span class="vn-name" id="vn-name">Amy</span>
            </div>
            <div class="vn-text-area">
                <div class="vn-text" id="vn-text"></div>

                <div class="vn-controls">
                    <button class="vn-control-btn" id="btn-mute" onclick="toggleMute(event)" title="Bật/Tắt âm thanh">🔊</button>
                    <button class="vn-control-btn" id="btn-auto" onclick="toggleAuto(event)">Auto</button>
                    <button class="vn-control-btn" id="btn-log" onclick="openLog(event)">Log</button>
                </div>
                <div class="vn-next-indicator" id="vn-indicator">▼</div>
            </div>
        </div>
    </div>

    <!-- Log Modal -->
    <div class="vn-log-modal" id="vn-log-modal" onclick="closeLog()">
        <div class="vn-log-content" onclick="event.stopPropagation()">
            <div class="vn-log-header">
                <span>LỊCH SỬ HỘI THOẠI</span>
                <span class="vn-log-close" onclick="closeLog()">&times;</span>
            </div>
            <div class="vn-log-body" id="vn-log-body">
                <!-- Log entries injected here -->
            </div>
        </div>
    </div>

    <!-- Windows Desktop (shown after dialogue ends) -->
    <div class="windows-desktop" id="windows-desktop">
        <div class="windows-wallpaper" id="windows-wallpaper" style="background-image: url('assets/img/windows/nen.png');">

                <img src="assets/img/windows/my_computer.png" alt="My Computer">
                <span>My Computer</span>
            </div>
            <div class="desktop-icon" data-app="paint" title="Paint">
                <img src="assets/img/windows/paint.png" alt="Paint">
                <span>Paint</span>
            </div>
            <div class="desktop-icon" data-app="calendar" title="Calendar">
                <img src="assets/img/windows/calendar.png" alt="Calendar">
                <span>Calendar</span>
            </div>
            <div class="desktop-icon" data-app="album" title="Album">
                <img src="assets/img/windows/album.png" alt="Album">
                <span>Album</span>
            </div>
            <div class="desktop-icon" data-app="notepad" title="Notepad">
                <img src="assets/img/windows/notepad.png" alt="Notepad">
                <span>Notepad</span>
            </div>
            <div class="desktop-icon" data-app="news" title="News">
                <img src="assets/img/windows/news_icon.png" alt="News">
                <span>News</span>
            </div>
            <div class="desktop-icon" data-app="settings" title="Settings">
                <img src="assets/img/windows/setting.png" alt="Settings">
                <span>Settings</span>
            </div>
            <div class="desktop-icon" data-app="donate" title="Donate">
                <img src="assets/img/windows/donate.png" alt="Donate">
                <span>Donate</span>
            </div>
        </div>
        <div class="windows-taskbar">
            <img class="windows-taskbar-bg" src="assets/img/windows/taskbar.png" alt="Taskbar">
            <div class="taskbar-controls">
                <button class="taskbar-start-btn" id="btn-start" title="Start — Tắt trình duyệt">

</div>

<!-- Audio elements -->
<audio id="vn-audio"></audio>
<audio id="sfx-snap" src="assets/audio/SFX/fingersnap.mp3" preload="auto"></audio>

        pose: NORMAL + "smile.png",

        effectAtEnd: "finish_tutorial"

];

// ── State ──
let currentStep = 0;
let isTyping = false;
let typeTimer = null;
let currentStepText = "";
let audioTimeCheckInterval = null;
let isAutoMode = false;
let dialogueHistory = [];
let advanceTimeout = null;

const audio       = document.getElementById("vn-audio");
const sfxSnap     = document.getElementById("sfx-snap");
const textEl      = document.getElementById("vn-text");
const nameEl      = document.getElementById("vn-name");
const spriteEl    = document.getElementById("vn-sprite");
const indicator   = document.getElementById("vn-indicator");
const vnContainer = document.getElementById("vn-container");
const flashEl     = document.getElementById("flash-overlay");
const winDesktop  = document.getElementById("windows-desktop");

const btnAuto     = document.getElementById("btn-auto");
const logModal    = document.getElementById("vn-log-modal");
const logBody     = document.getElementById("vn-log-body");

// Preload all images
vnScript.forEach(s => { const i = new Image(); i.src = s.pose; });

// ────────────────────────────────────────────
//  AUTO-START (no start screen)
// ────────────────────────────────────────────
window.addEventListener("DOMContentLoaded", () => {
    displayStep(0);
});

// ────────────────────────────────────────────
//  AUTO & LOG LOGIC
// ────────────────────────────────────────────
function toggleAuto(e) {
    if (e) e.stopPropagation();
    isAutoMode = !isAutoMode;
    btnAuto.classList.toggle("active", isAutoMode);
    
    // If we just turned it on and typing is done, advance
    if (isAutoMode && !isTyping) {
        checkAutoAdvance();
    }
}

let isMuted = false;
function toggleMute(e) {
    if (e) e.stopPropagation();
    isMuted = !isMuted;
    if (audio) audio.muted = isMuted;
    if (sfxSnap) sfxSnap.muted = isMuted;
    const btnMute = document.getElementById("btn-mute");
    if (btnMute) {
        btnMute.textContent = isMuted ? "🔇" : "🔊";
    }
}

function openLog(e) {
    if (e) e.stopPropagation();
    logBody.innerHTML = "";
    dialogueHistory.forEach(entry => {
        const div = document.createElement("div");
        div.className = "vn-log-entry";
        div.innerHTML = `<span class="vn-log-name">${entry.name}:</span><span class="vn-log-text">${entry.text}</span>`;
        logBody.appendChild(div);
    });
    logModal.classList.add("visible");
    logBody.scrollTop = logBody.scrollHeight;
}

function closeLog() {
    logModal.classList.remove("visible");
}

function checkAutoAdvance() {
    if (isAutoMode && !isTyping) {
        setTimeout(() => {
            if (isAutoMode && !isTyping) {
                advanceDialogue(true);
            }
        }, 1500); // Wait 1.5s after text finishes
    }
}

// ────────────────────────────────────────────
//  TYPE TEXT synced to duration
// ────────────────────────────────────────────
function typeTextSync(text, durationSec) {
    isTyping = true;
    textEl.textContent = "";
    indicator.classList.remove("visible");

    const totalChars = text.length;
    const speed = Math.max(20, (durationSec * 1000) / totalChars);
    let idx = 0;

    typeTimer = setInterval(() => {
        if (idx < totalChars) {
            textEl.textContent += text[idx];
            idx++;
        } else {
            clearInterval(typeTimer);
            typeTimer = null;
            isTyping = false;
            indicator.classList.add("visible");
            if (isAutoMode) checkAutoAdvance();
        }
    }, speed);
}

// ────────────────────────────────────────────
//  PLAY ANIMATION on sprite
// ────────────────────────────────────────────
function playAnim(animName) {
    spriteEl.classList.remove("idle", "hop", "shake", "lean", "enter", "nod");
    void spriteEl.offsetWidth;
    spriteEl.classList.add(animName);

    if (animName !== "idle") {
        const dur = animName === "enter" ? 800 : 550;
        setTimeout(() => {
            spriteEl.classList.remove(animName);
            spriteEl.classList.add("idle");
        }, dur);
    }
}

// ────────────────────────────────────────────
//  DISPLAY STEP
// ────────────────────────────────────────────
function displayStep(stepIndex) {
    if (stepIndex >= vnScript.length) return;

    const step = vnScript[stepIndex];
    currentStepText = step.text;
    nameEl.textContent = step.name;
    
    // Add to history
    dialogueHistory.push({ name: step.name, text: step.text });

    // Handle spotlighting
    const spotlightOverlay = document.getElementById("spotlight-overlay");
    if (spotlightOverlay) {
        document.querySelectorAll(".desktop-icon.spotlighted").forEach(el => el.classList.remove("spotlighted"));
        if (step.highlightApps && step.highlightApps.length > 0) {
            spotlightOverlay.style.opacity = "1";
            step.highlightApps.forEach(appId => {
                const el = document.querySelector(`.desktop-icon[data-app='${appId}']`);
                if (el) el.classList.add("spotlighted");
            });
        } else {
            spotlightOverlay.style.opacity = "0";
        }
    }

    // Handle Amy position
    const spriteWrap = document.querySelector(".vn-character-wrap");
    if (step.side === "right") {
        spriteWrap.classList.add("side-right");
    } else {
        spriteWrap.classList.remove("side-right");
    }

    // Clear any previous audio time check
    if (audioTimeCheckInterval) {
        clearInterval(audioTimeCheckInterval);
        audioTimeCheckInterval = null;
    }

    // Update sprite
    const poseChanged = spriteEl.src !== new URL(step.pose, window.location.href).href;
    if (poseChanged) {
        spriteEl.style.opacity = "0";
        setTimeout(() => {
            spriteEl.src = step.pose;
            spriteEl.onload = () => {
                spriteEl.style.opacity = "1";
                if (step.anim) playAnim(step.anim);
            };
        }, 180);
    } else {
        if (step.anim) playAnim(step.anim);
    }

    // Handle audio — either new audio file, or resume existing
    if (step.audioResume) {
        // Continue playing the current audio, just type new text
        const remainingTime = step.audioEndTime
            ? step.audioEndTime - audio.currentTime
            : audio.duration - audio.currentTime;
        const typeDuration = Math.min(remainingTime, step.audioEndTime ? step.audioEndTime - audio.currentTime : 999);
        typeTextSync(step.text, Math.max(2, typeDuration));

        // If this step has an audioEndTime, wait for it
        if (step.audioEndTime) {
            audioTimeCheckInterval = setInterval(() => {
                if (audio.currentTime >= step.audioEndTime) {
                    clearInterval(audioTimeCheckInterval);
                    audioTimeCheckInterval = null;
                    handleEndEffect(step, stepIndex);
                }
            }, 100);
        } else {
            // Wait for audio to fully end
            audio.onended = () => {
                handleEndEffect(step, stepIndex);
            };
        }
    } else if (step.audio) {
        // New audio file
        audio.src = step.audio;
        audio.onloadedmetadata = () => {
            if (step.audioStartTime) {
                audio.currentTime = step.audioStartTime;
            }
            audio.play();

            const totalDur = step.audioEndTime
                ? step.audioEndTime - (step.audioStartTime || 0)
                : audio.duration;
            typeTextSync(step.text, totalDur);
        };

        if (step.audioEndTime && step.noAutoAdvanceAudio) {
            // Stop checking at audioEndTime
            audioTimeCheckInterval = setInterval(() => {
                if (audio.currentTime >= step.audioEndTime) {
                    clearInterval(audioTimeCheckInterval);
                    audioTimeCheckInterval = null;
                    handleEndEffect(step, stepIndex);
                }
            }, 100);
        } else if (!step.noAutoAdvanceAudio) {
            audio.onended = () => {
                handleEndEffect(step, stepIndex);
            };
        }
    } else {
        // No audio — just type at a comfortable speed
        typeTextSync(step.text, 4);
    }
}

// ────────────────────────────────────────────
//  HANDLE END-OF-STEP EFFECTS
// ────────────────────────────────────────────
function handleEndEffect(step, stepIndex) {
    if (step.effectAtEnd === "transform") {
        // Fingersnap SFX + Flash → pixel→normal transition
        sfxSnap.currentTime = 0;
        sfxSnap.play();
        flashEl.classList.add("active");
        if (advanceTimeout) clearTimeout(advanceTimeout);
        advanceTimeout = setTimeout(() => {
            flashEl.classList.remove("active");
            autoAdvance(stepIndex);
        }, 700);

    } else if (step.effectAtEnd === "windows") {
        // Show Windows desktop
        if (advanceTimeout) clearTimeout(advanceTimeout);
        advanceTimeout = setTimeout(() => {
            finishTyping();
            document.getElementById("vn-dialogue-bar").style.transition = "opacity 0.8s ease";
            document.getElementById("vn-dialogue-bar").style.opacity = "0";
            document.getElementById("vn-dialogue-bar").style.pointerEvents = "none";
            spriteEl.style.transition = "opacity 0.8s ease";
            spriteEl.style.opacity = "0";

            advanceTimeout = setTimeout(() => {
                winDesktop.classList.add("visible");
                initDesktop();
                
                // Wait 3 seconds, then bring Amy back for the guide
                advanceTimeout = setTimeout(() => {
                    document.getElementById("vn-dialogue-bar").style.opacity = "1";
                    document.getElementById("vn-dialogue-bar").style.pointerEvents = "all";
                    spriteEl.style.opacity = "1";
                    advanceDialogue(true);
                }, 3000);
            }, 900);
        }, 1500);

    } else if (step.effectAtEnd === "finish_tutorial") {
        if (advanceTimeout) clearTimeout(advanceTimeout);
        finishTyping();
        document.getElementById("vn-dialogue-bar").style.transition = "opacity 0.8s ease";
        document.getElementById("vn-dialogue-bar").style.opacity = "0";
        document.getElementById("vn-dialogue-bar").style.pointerEvents = "none";
        
        const spriteWrap = document.querySelector(".vn-character-wrap");
        if (spriteWrap) {
            spriteWrap.style.transition = "opacity 0.8s ease, transform 0.8s ease, left 0.8s ease";
            spriteWrap.style.opacity = "0";
            spriteWrap.style.pointerEvents = "none";
        }
        
        const spotlightOverlay = document.getElementById("spotlight-overlay");
        if (spotlightOverlay) {
            spotlightOverlay.style.opacity = "0";
            document.querySelectorAll(".desktop-icon.spotlighted").forEach(el => el.classList.remove("spotlighted"));
        }
    } else {
        autoAdvance(stepIndex);
    }
}

function autoAdvance(stepIndex) {
    if (advanceTimeout) clearTimeout(advanceTimeout);
    advanceTimeout = setTimeout(() => {
        if (currentStep === stepIndex) {
            finishTyping();
            advanceDialogue(true);
        }
    }, 800);
}

function finishTyping() {
    if (isTyping && typeTimer) {
        clearInterval(typeTimer);
        typeTimer = null;
        textEl.textContent = vnScript[currentStep].text;
        isTyping = false;
    }
}

// ────────────────────────────────────────────
//  ADVANCE (click or auto)
// ────────────────────────────────────────────
function advanceDialogue(auto = false) {
    if (advanceTimeout) {
        clearTimeout(advanceTimeout);
        advanceTimeout = null;
    }
    if (currentStep >= vnScript.length - 1 && !isTyping) return;
    
    if (isTyping) {
        if (!auto) {
            finishTyping();
            indicator.classList.add("visible");
            if (isAutoMode) checkAutoAdvance();
        }
    } else {
        currentStep++;
        displayStep(currentStep);
    }
}

function initDesktop() {
    // ── Live Clock ──
    updateClock();
    clockInterval = setInterval(updateClock, 1000);

    // ── Start button — closes the browser tab ──
    document.getElementById("btn-start").addEventListener("click", () => {
        window.close();
        setTimeout(() => { window.location.href = "about:blank"; }, 300);
    });

    // ── Speaker icon — toggle mute visual ──
    const speakerIcon = document.getElementById("speaker-icon");
    let speakerState = 2; // 0=mute, 1=low, 2=high
    const speakerImages = [
        "assets/img/windows/no_sound_speaker.png",
        "assets/img/windows/1-50_speaker.png",
        "assets/img/windows/51-100_speaker.png"
    ];
    speakerIcon.addEventListener("click", (e) => {
        e.stopPropagation();
        speakerState = (speakerState + 1) % 3;
        speakerIcon.src = speakerImages[speakerState];
    });

    // ── Desktop icons — double-click to open window ──
    document.querySelectorAll(".desktop-icon").forEach(icon => {
        icon.addEventListener("dblclick", () => {
            const appId = icon.getAttribute("data-app");
            if (appId && APP_DEFS[appId]) {
                openAppWindow(appId);
            }
        });
    });
}

function updateClock() {
    const now = new Date();
    const h = String(now.getHours()).padStart(2, "0");
    const m = String(now.getMinutes()).padStart(2, "0");
    document.getElementById("taskbar-clock").textContent = h + ":" + m;
}

// ────────────────────────────────────────────
//  WINDOW MANAGER
// ────────────────────────────────────────────
function openAppWindow(appId) {
    // If already open, focus it
    if (openWindows[appId]) {
        const existing = openWindows[appId];
        if (existing.el.classList.contains("minimized")) {
            existing.el.classList.remove("minimized");
        }
        focusWindow(appId);
        return;
    }

    const def = APP_DEFS[appId];
    const wallpaper = document.getElementById("windows-wallpaper");

    // Calculate position (stagger each new window)
    const count = Object.keys(openWindows).length;
    const startX = 60 + count * 30;
    const startY = 40 + count * 30;

    // Build window DOM
    const win = document.createElement("div");
    win.className = "win-window";
    win.id = "win-" + appId;
    win.style.left = startX + "px";
    win.style.top = startY + "px";
    win.style.width = def.width + "px";
    win.style.height = def.height + "px";

    win.innerHTML = `
        <div class="win-titlebar" data-win="${appId}">
            <img class="win-titlebar-icon" src="${def.icon}" alt="">
            <span class="win-titlebar-text">${def.title}</span>
            <div class="win-titlebar-btns">
                <button class="win-btn win-btn-min" data-action="min" title="Minimize">─</button>
                <button class="win-btn win-btn-max" data-action="max" title="Maximize">☐</button>
                <button class="win-btn win-btn-close" data-action="close" title="Close">✕</button>
            </div>
        </div>
        <div class="win-body">${def.content}</div>
        <div class="win-resize-handle" data-win="${appId}"></div>
    `;

    wallpaper.appendChild(win);

    // Call onOpen hook if defined
    if (def.onOpen) def.onOpen();

    // Store state
    openWindows[appId] = {
        el: win,
        title: def.title,
        icon: def.icon,
        prevBounds: null
    };

    focusWindow(appId);
    addTaskbarButton(appId, def.title);

    // ── Event: click to focus ──
    win.addEventListener("mousedown", () => focusWindow(appId));

    // ── Event: title bar buttons ──
    win.querySelectorAll(".win-btn").forEach(btn => {
        btn.addEventListener("click", (e) => {
            e.stopPropagation();
            const action = btn.getAttribute("data-action");
            if (action === "min") minimizeWindow(appId);
            else if (action === "max") toggleMaximize(appId);
            else if (action === "close") closeWindow(appId);
        });
    });

    // ── Drag ──
    initDrag(win, appId);

    // ── Resize ──
    initResize(win, appId);
}

function focusWindow(appId) {
    windowZCounter++;
    if (openWindows[appId]) {
        openWindows[appId].el.style.zIndex = windowZCounter;
    }
    // Update taskbar active state
    document.querySelectorAll(".taskbar-win-btn").forEach(btn => {
        btn.classList.toggle("active", btn.getAttribute("data-win") === appId);
    });
}

function minimizeWindow(appId) {
    if (openWindows[appId]) {
        openWindows[appId].el.classList.add("minimized");
    }
}

function toggleMaximize(appId) {
    const w = openWindows[appId];
    if (!w) return;
    const el = w.el;

    if (el.classList.contains("maximized")) {
        // Restore
        el.classList.remove("maximized");
        if (w.prevBounds) {
            el.style.left = w.prevBounds.left;
            el.style.top = w.prevBounds.top;
            el.style.width = w.prevBounds.width;
            el.style.height = w.prevBounds.height;
        }
    } else {
        // Save & maximize
        w.prevBounds = {
            left: el.style.left,
            top: el.style.top,
            width: el.style.width,
            height: el.style.height
        };
        el.classList.add("maximized");
    }
}

function closeWindow(appId) {
    if (openWindows[appId]) {
        openWindows[appId].el.remove();
        delete openWindows[appId];
        removeTaskbarButton(appId);
    }
}

// ── Taskbar buttons ──
function addTaskbarButton(appId, title) {
    const bar = document.getElementById("taskbar-windows");
    const btn = document.createElement("button");
    btn.className = "taskbar-win-btn active";
    btn.setAttribute("data-win", appId);
    btn.textContent = title;
    btn.addEventListener("click", () => {
        const w = openWindows[appId];
        if (!w) return;
        if (w.el.classList.contains("minimized")) {
            w.el.classList.remove("minimized");
            focusWindow(appId);
        } else if (parseInt(w.el.style.zIndex) === windowZCounter) {
            // Already focused → minimize
            minimizeWindow(appId);
        } else {
            focusWindow(appId);
        }
    });
    bar.appendChild(btn);
}

function removeTaskbarButton(appId) {
    const btn = document.querySelector(`.taskbar-win-btn[data-win="${appId}"]`);
    if (btn) btn.remove();
}

// ── Drag logic ──
function initDrag(win, appId) {
    const titlebar = win.querySelector(".win-titlebar");
    let isDragging = false, startX, startY, origLeft, origTop;

    titlebar.addEventListener("mousedown", (e) => {
        if (e.target.closest(".win-btn")) return;
        if (win.classList.contains("maximized")) return;
        isDragging = true;
        startX = e.clientX;
        startY = e.clientY;
        origLeft = win.offsetLeft;
        origTop = win.offsetTop;
        focusWindow(appId);
        e.preventDefault();
    });

    document.addEventListener("mousemove", (e) => {
        if (!isDragging) return;
        const dx = e.clientX - startX;
        const dy = e.clientY - startY;
        win.style.left = (origLeft + dx) + "px";
        win.style.top = (origTop + dy) + "px";
    });

    document.addEventListener("mouseup", () => {
        isDragging = false;
    });
}

// ── Resize logic ──
function initResize(win, appId) {
    const handle = win.querySelector(".win-resize-handle");
    let isResizing = false, startX, startY, origW, origH;

    handle.addEventListener("mousedown", (e) => {
        if (win.classList.contains("maximized")) return;
        isResizing = true;
        startX = e.clientX;
        startY = e.clientY;
        origW = win.offsetWidth;
        origH = win.offsetHeight;
        focusWindow(appId);
        e.preventDefault();
        e.stopPropagation();
    });

    document.addEventListener("mousemove", (e) => {
        if (!isResizing) return;
        const newW = Math.max(320, origW + (e.clientX - startX));
        const newH = Math.max(200, origH + (e.clientY - startY));
        win.style.width = newW + "px";
        win.style.height = newH + "px";
    });

    document.addEventListener("mouseup", () => {
        isResizing = false;
    });
}
