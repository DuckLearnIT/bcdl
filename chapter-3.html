<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chapter 3 — Amy</title>
<link href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,400;0,700;1,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/visual-novel.css">
</head>
<body>

<!-- Flash overlay -->
<div class="flash-overlay" id="flash-overlay"></div>

<!-- Start Screen -->
<div class="start-screen" id="start-screen">
    <h1>Chapter 3</h1>
    <p>Hãy bật âm thanh để có trải nghiệm tốt nhất.</p>
    <button class="start-btn" onclick="startChapter()">Bắt đầu</button>
</div>

<!-- Main VN Scene -->
<div class="vn-container" id="vn-container" style="display: none;">

    <!-- Background (white) -->
    <div class="vn-background"></div>

    <!-- Character Sprite — centered, behind dialogue bar -->
    <div class="vn-character-wrap">
        <img id="vn-sprite" class="vn-sprite" src="assets/img/amy/pixel/surprise.png" alt="Amy">
    </div>

    <!-- Dialogue Bar — dialogue_bar.png -->
    <div class="vn-dialogue-bar" id="vn-dialogue-bar" onclick="advanceDialogue()">
        <div class="vn-dialogue-inner">
            <img class="bar-bg" src="assets/img/dialogue_bar.png" alt="">
            <div class="vn-name" id="vn-name">Amy</div>
            <div class="vn-text" id="vn-text"></div>
            <div class="vn-next-indicator" id="vn-indicator">▼</div>
        </div>
    </div>

    <!-- Windows Desktop (shown after dialogue ends) -->
    <div class="windows-desktop" id="windows-desktop">
        <div class="windows-wallpaper" style="background-image: url('assets/img/windows/nen.png');"></div>
        <div class="windows-taskbar">
            <img src="assets/img/windows/taskbar.png" alt="Taskbar">
        </div>
    </div>

</div>

<!-- Audio elements -->
<audio id="vn-audio"></audio>
<audio id="sfx-snap" src="assets/audio/SFX/fingersnap.mp3" preload="auto"></audio>

<script src="assets/js/dialogue-fit.js"></script>
<script>
// ================================================================
//  KỊCH BẢN — Dựa trên hoithoai.txt
//  7 audio files → 7 dialogue steps
//  Pixel poses trước "Tada~!", Normal poses sau đó
// ================================================================

const PIXEL = "assets/img/amy/pixel/";
const NORMAL = "assets/img/amy/normal/";
const TEXT_FIT_OPTIONS = {
    minFontPx: 10,
    maxFontPx: 24,
    minLineHeight: 1.18,
    maxLineHeight: 1.45
};

const vnScript = [
    // ── Audio 1 (6s) — Lines 1+2: Ngạc nhiên + bối rối ──
    {
        name: "Amy",
        text: "Ơ kìa...? Tín hiệu kết nối đã được thiết lập rồi sao? A! Có người dùng đang ở đầu dây bên kia! Xin lỗi, mình không nghĩ là bạn lại log-in vào sớm như vậy!",
        pose: PIXEL + "surprise.png",
        audio: "assets/audio/Dialougue/1.wav",
        anim: "enter"
    },
    // ── Audio 2 (10s) — Line 3: Chào hỏi vui vẻ ──
    {
        name: "Amy",
        text: "Khụ... Xin chào! Rất vui được gặp bạn. Chào mừng bạn đã truy cập vào hệ thống. Mình là Amy, từ nay sẽ chịu trách nhiệm hỗ trợ bạn trong vùng không gian này.",
        pose: PIXEL + "smile.png",
        audio: "assets/audio/Dialougue/2.wav",
        anim: "hop"
    },
    // ── Audio 3 (6s) — Line 4: Bối rối nhận ra lỗi ──
    {
        name: "Amy",
        text: "Nhưng mà... khoan đã. Hình như có gì đó sai sai ở luồng dữ liệu hiển thị thì phải?",
        pose: PIXEL + "thinking.png",
        audio: "assets/audio/Dialougue/3.wav",
        anim: "lean"
    },
    // ── Audio 4 (4s) — Line 5: Nhìn xuống bản thân ──
    {
        name: "Amy",
        text: "Sao góc nhìn của bạn... lại thấy mình... vuông vức thế này?",
        pose: PIXEL + "thinking.png",
        audio: "assets/audio/Dialougue/4.wav",
        anim: "shake"
    },
    // ── Audio 5 (26s) — Lines 6+7+8+9: Kiểm tra, tìm lỗi, snap ──
    {
        name: "Amy",
        text: "Để mình kiểm tra lại log hệ thống một chút nhé. Lạ thật, rõ ràng mình đã render xong model nhân vật độ phân giải cao rồi mà nhỉ... Do thiếu RAM chăng? Hay do bộ nhớ đệm bị đầy? Aha! Tìm ra lỗi rồi! Là do mình quên chưa tắt chế độ 'Khởi động an toàn tiết kiệm tài nguyên'. Thật là một sai sót ngớ ngẩn... Bạn nhắm mắt lại 1 giây nhé, để mình nạp lại file giao diện. Khôi phục dữ liệu gốc. Cập nhật!",
        pose: PIXEL + "pointout.png",
        audio: "assets/audio/Dialougue/5.wav",
        anim: "shake",
        effectAtEnd: "transform"   // Flash + fingersnap → pixel→normal
    },
    // ── Audio 6 (10s) — Lines 10+11: Tada! HD! ──
    {
        name: "Amy",
        text: "Tada~! Bạn nhìn thấy mình rõ hơn rồi chứ? Giao diện 2D High-Resolution này tốn công ép xung hệ thống lắm đấy nhé! Được rồi, phần ngoại hình đã xong. Bây giờ chúng ta phải tạo một không gian làm việc thật thoải mái cho bạn.",
        pose: NORMAL + "smile.png",    // ← NORMAL (HD) từ đây!
        audio: "assets/audio/Dialougue/6.wav",
        anim: "hop"
    },
    // ── Audio 7 (7s) — Lines 12+13+14: Windows desktop ──
    {
        name: "Amy",
        text: "Vì theo phân tích dữ liệu, dường như bạn thích những thứ mang cảm giác hoài niệm... Chuẩn bị tinh thần nhé! Xuyên không về quá khứ thôi! Thế nào? Tuyệt tác hệ điều hành đầu thập niên 2000! Chào mừng đến với không gian làm việc mới của chúng ta!",
        pose: NORMAL + "pointout.png",
        audio: "assets/audio/Dialougue/7.wav",
        anim: "hop",
        effectAtEnd: "windows"   // Chuyển sang Windows desktop
    }
];

// ── State ──
let currentStep = 0;
let isTyping = false;
let typeTimer = null;
let currentStepText = "";

const audio       = document.getElementById("vn-audio");
const sfxSnap     = document.getElementById("sfx-snap");
const textEl      = document.getElementById("vn-text");
const nameEl      = document.getElementById("vn-name");
const spriteEl    = document.getElementById("vn-sprite");
const indicator   = document.getElementById("vn-indicator");
const vnContainer = document.getElementById("vn-container");
const flashEl     = document.getElementById("flash-overlay");
const winDesktop  = document.getElementById("windows-desktop");

// Preload all images
vnScript.forEach(s => { const i = new Image(); i.src = s.pose; });

// ────────────────────────────────────────────
//  START
// ────────────────────────────────────────────
function startChapter() {
    const ss = document.getElementById("start-screen");
    ss.style.opacity = "0";
    setTimeout(() => {
        ss.style.display = "none";
        vnContainer.style.display = "block";
        displayStep(0);
    }, 1000);
}

// ────────────────────────────────────────────
//  TYPE TEXT synced to audio duration
// ────────────────────────────────────────────
function typeTextSync(text, durationSec) {
    isTyping = true;
    if (window.fitDialogueText) {
        window.fitDialogueText(textEl, text, TEXT_FIT_OPTIONS);
    }
    textEl.textContent = "";
    indicator.classList.remove("visible");

    const totalChars = text.length;
    const speed = Math.max(20, (durationSec * 1000) / totalChars);
    let idx = 0;

    typeTimer = setInterval(() => {
        if (idx < totalChars) {
            textEl.textContent += text[idx];
            idx++;
        } else {
            clearInterval(typeTimer);
            typeTimer = null;
            isTyping = false;
            indicator.classList.add("visible");
        }
    }, speed);
}

// ────────────────────────────────────────────
//  PLAY ANIMATION on sprite
// ────────────────────────────────────────────
function playAnim(animName) {
    spriteEl.classList.remove("idle", "hop", "shake", "lean", "enter", "nod");
    void spriteEl.offsetWidth;
    spriteEl.classList.add(animName);

    if (animName !== "idle") {
        const dur = animName === "enter" ? 800 : 550;
        setTimeout(() => {
            spriteEl.classList.remove(animName);
            spriteEl.classList.add("idle");
        }, dur);
    }
}

// ────────────────────────────────────────────
//  DISPLAY STEP
// ────────────────────────────────────────────
function displayStep(stepIndex) {
    if (stepIndex >= vnScript.length) {
        // Hết hội thoại — đã có effectAtEnd:"windows" ở step cuối
        return;
    }

    const step = vnScript[stepIndex];
    currentStepText = step.text;
    nameEl.textContent = step.name;

    // Update sprite
    const poseChanged = spriteEl.src !== new URL(step.pose, window.location.href).href;
    if (poseChanged) {
        spriteEl.style.opacity = "0";
        setTimeout(() => {
            spriteEl.src = step.pose;
            spriteEl.onload = () => {
                spriteEl.style.opacity = "1";
                if (step.anim) playAnim(step.anim);
            };
        }, 180);
    } else {
        if (step.anim) playAnim(step.anim);
    }

    // Play audio and sync typing
    audio.src = step.audio;
    audio.onloadedmetadata = () => {
        audio.play();
        typeTextSync(step.text, audio.duration);
    };

    // When audio ends
    audio.onended = () => {
        handleEndEffect(step, stepIndex);
    };
}

// ────────────────────────────────────────────
//  HANDLE END-OF-STEP EFFECTS
// ────────────────────────────────────────────
function handleEndEffect(step, stepIndex) {
    if (step.effectAtEnd === "transform") {
        // Fingersnap SFX + Flash → pixel→normal transition
        sfxSnap.currentTime = 0;
        sfxSnap.play();
        flashEl.classList.add("active");
        setTimeout(() => {
            flashEl.classList.remove("active");
            autoAdvance(stepIndex);
        }, 700);

    } else if (step.effectAtEnd === "windows") {
        // Show Windows desktop
        setTimeout(() => {
            // Complete any remaining typing
            finishTyping();
            // Fade out dialogue and character
            document.getElementById("vn-dialogue-bar").style.transition = "opacity 0.8s ease";
            document.getElementById("vn-dialogue-bar").style.opacity = "0";
            spriteEl.style.transition = "opacity 0.8s ease";
            spriteEl.style.opacity = "0";

            setTimeout(() => {
                winDesktop.classList.add("visible");
            }, 900);
        }, 1500);

    } else {
        autoAdvance(stepIndex);
    }
}

function autoAdvance(stepIndex) {
    setTimeout(() => {
        if (currentStep === stepIndex) {
            finishTyping();
            advanceDialogue(true);
        }
    }, 1000);
}

function finishTyping() {
    if (isTyping && typeTimer) {
        clearInterval(typeTimer);
        typeTimer = null;
        textEl.textContent = vnScript[currentStep].text;
        if (window.fitDialogueText) {
            window.fitDialogueText(textEl, vnScript[currentStep].text, TEXT_FIT_OPTIONS);
        }
        isTyping = false;
    }
}

// ────────────────────────────────────────────
//  ADVANCE (click or auto)
// ────────────────────────────────────────────
function advanceDialogue(auto = false) {
    if (isTyping) {
        if (!auto) {
            finishTyping();
            indicator.classList.add("visible");
        }
    } else {
        currentStep++;
        displayStep(currentStep);
    }
}

const refitCurrentDialogue = (window.debounce || function (fn) { return fn; })(() => {
    if (currentStep < vnScript.length) {
        const step = vnScript[currentStep];
        currentStepText = step ? step.text : currentStepText;
        if (currentStepText && window.fitDialogueText) {
            window.fitDialogueText(textEl, currentStepText, TEXT_FIT_OPTIONS);
        }
    }
}, 140);

window.addEventListener("resize", refitCurrentDialogue);
</script>
</body>
</html>
